<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Task Management System</title>
        <link href="./dist/output.css" rel="stylesheet" />
        <link rel="icon" href="./images/favicon.png" />
    </head>
    <body background="images/background.png">
        <div class="container gap-3 mx-auto w-full">
            <div class="flex flex-col col-span-3">
                <h1>Task Management</h1>
            </div>
            <div class="grid grid-cols-2 gap-2 items-center my-10">
                <input
                    class="border-cyan-800 border-4 rounded-md p-2"
                    id="taskName"
                    type="text"
                    placeholder="Add Task"
                />
                <button id="addButton" class="btn-add" type="submit">ADD</button>
            </div>
            <div class="flex row-start-3 items-center">
                <h2>Task List</h2>
            </div>
            <div id="taskList" class="grid row-start-4 grid-cols-1 gap-3 m-1"></div>
        </div>
        <script type="module" src="./dist/index.js" defer></script>
    </body>
</html>
