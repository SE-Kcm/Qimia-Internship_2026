<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body>
    <div class="container border border-orange-900 mx-auto">
      <div class="grid gap-3">
        <div class="flex flex-col col-span-3">
            <h1>Task Management</h1>
        </div>
        <div class="grid grid-cols-2 gap-2">
            <input id="taskName" type="text" placeholder="Add Task">
            <button id="addButton" class="btn-add" type="submit">Add</button>
        </div>
        <div class="flex row-start-3 space-x-10 items-center">
            <h1>Task List</h1>
        </div>
        <div id= "taskList" class="grid row-start-4 grid-cols-1 gap-3">
        </div>
      </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
