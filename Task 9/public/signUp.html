<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cartify SignUp</title>
        <link rel="stylesheet" href="../dist/output.css" />
    </head>
    <body class="bg-gray-100">
        <header class="h-20 bg-white w-screen">
            <div class="grid grid-cols-3">
                <a class="flex mx-2 items-center" href="index.html">
                    <img class="w-6" src="images/House_Icon.png" />
                    <span class="hidden md:block text-sm font-bold ml-1">Geri</span>
                </a>
                <div class="flex col-span-1 justify-center">
                    <img class="flex w-40 h-20" src="./images/Logo_new.png" />
                </div>
            </div>
        </header>
        <main>
            <section id="step1" class="container max-w-xl px-4 mx-auto text-left">
                <h1>Hesap Oluştur</h1>
                <div class="tab flex my-3">
                    <button id="emailTab" class="tablinks active w-1/2 border-b-4 border-b-blue-800">E-Mail</button>
                    <button id="phoneTab" class="tablinks active w-1/2 border-b-4 border-b-gray-400">Telefon Numarası</button>
                </div>
                <div id="E-Mail" class="tabcontent">
                    <form id="signUpEmailForm">
                        <p id="generalErrorEmail" class="Error"></p>
                        <label>E-posta</label>
                        <input id="email" name="email" class="w-full mt-1 h-10 text-left p-2" type="email" placeholder="E-posta" required />
                        <p id="emailError" class="Error"></p>
                        <label>Password</label>
                        <input id="password_email" name="password" class="w-full mt-1 h-10 text-left p-2" type="password" placeholder="Password" required />
                        <p id="passwordErrorEmail" class="Error"></p>
                        <button class="button w-full bg-blue-70 h-10" type="submit">İleri</button>
                    </form>
                </div>
                <div id="Phone" class="tabcontent hidden">
                    <form id="signUpPhoneForm">
                        <p id="generalErrorPhone" class="Error"></p>
                        <div class="flex items-center justify-center gap-1">
                            <div class="w-1/3 flex flex-col">
                                <label>Ülke </label>
                                <select id="countryCode" class="w-full h-10 mt-1 mb-3 px-2 border-2 border-gray-300 bg-white" id="country-code" name="countryCode" required>
                                    <option value="+90">🇹🇷 +90 (TR)</option>
                                </select>
                                <!-- <label for="country">Ülke </label>
                                <input id="country" class="w-full mt-1 mb-3 h-10 text-left p-2" type="email" placeholder="Ülke" /> -->
                            </div>
                            <div class="w-2/3">
                                <label>Telefon Numarası </label>
                                <input id="phoneNumber" name="phoneNumber" class="w-full mt-1 mb-3 h-10 text-left p-2" type="tel" placeholder="Cep telefonu numarası" required />
                            </div>
                        </div>
                        <p id="phoneError" class="Error"></p>
                        <label>Password</label>
                        <input id="password_phone" name="password" class="w-full mt-1 mb-3 h-10 text-left p-2" type="password" placeholder="Password" required />
                        <p id="passwordErrorPhone" class="Error"></p>
                        <button class="button w-full bg-blue-70 h-10" type="submit">İleri</button>
                    </form>
                </div>
                <p class="font-semibold text-base mt-4">Cartify hesabın var mı?</p>
                <a class="flex items-center mt-2 text-blue-700 underline underline-offset-2" href="Login.html">Oturum Aç</a>
            </section>
            <section id="step2" class="hidden container max-w-xl px-4 mx-auto text-left">
                <h1>Kişisel Bilgiler</h1>
                <form id="signUpInformationForm" class="mt-2">
                    <input id="firstName" name="firstName" type="text" placeholder="Ad" class="w-full mt-1 mb-3 h-10 text-left p-2" />

                    <input id="lastName" name="lastName" type="text" placeholder="Soyad" class="w-full mt-1 mb-3 h-10 text-left p-2" />
                    <!-- <input id="signUpEmail" name="signUpEmail" type="email" value="E-Posta" class="w-full mt-1 mb-3 h-10 text-left p-2" />
                    <div class="flex items-center justify-center gap-1">
                        <div class="w-1/3 flex flex-col">
                            <select id="countryCode" class="w-full h-10 mt-1 mb-3 px-2 border-2 border-gray-300 bg-white" id="country-code" name="countryCode">
                                <option value="+90">🇹🇷 +90 (TR)</option>
                            </select>
                        </div>
                        <div class="w-2/3">
                            <input id="signUpPhone" name="signUpPhone" type="tel" value="Telefon Numarası" class="w-full mt-1 mb-3 h-10 text-left p-2" />
                        </div>
                    </div> -->
                    <label>Doğum Tarihi:</label>
                    <input id="birthday" name="birthday" type="date" class="w-full mt-1 mb-3 h-10 text-left p-2" />
                    <input id="country" name="country" type="text" placeholder="Ülke" class="w-full mt-1 mb-3 h-10 text-left p-2" />
                    <input id="city" name="city" type="text" placeholder="Şehir" class="w-full mt-1 mb-3 h-10 text-left p-2" />
                    <input id="address" name="address" type="text" placeholder="Adres" class="w-full mt-1 mb-3 h-10 text-left p-2" />
                    <button class="button w-full bg-blue-70 h-10" type="submit">İleri</button>
                </form>
            </section>
        </main>
        <script type="importmap">
            {
                "imports": {
                    "zod": "https://cdn.jsdelivr.net/npm/zod@4.4.3/+esm"
                }
            }
        </script>
        <script type="module" src="../dist/login.js"></script>
    </body>
</html>
