<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Shopping Cart</title>
        <link rel="stylesheet" href="../dist/output.css" />
    </head>
    <body class="bg-gray-100">
        <header class="h-20 bg-white w-screen">
            <div class="container mx-auto flex h-full justify-between items-center">
                <a class="hidden md:flex mx-2 justify-center items-center" href="url"> &lt; <span class="underline underline-offset-1 font-bold text-sm ml-1">ALIŞVERİŞE DEVAM ET</span></a>
                <img class="w-40 h-20 md:absolute md:left-1/2 md:-translate-x-1/2" src="./images/Logo_new.png" />
                <div class="flex justify-center items-center">
                    <a id="currentUserName" class="font-semibold"></a>
                    <img class="w-14 sm:w-14" src="images/profileIcon.png" />
                </div>
            </div>
        </header>
        <main class="container mx-auto grid lg:grid-cols-3 grid-cols-1 gap-5 p-4">
            <section class="cart lg:col-span-2">
                <h2>Sepetim</h2>
                <div id="emptyCart" class="hidden bg-white p-5 flex justify-center items-center mt-4">
                    <img class="w-72" src="images/emptyCartIcon.png" />
                </div>
                <div id="columnNames" class="columnNames hidden lg:grid lg:grid-cols-5 mt-4 mb-2">
                    <p class="header col-span-2">ÜRÜN</p>
                    <p class="header text-center">BİRİM FİYAT</p>
                    <p class="header text-center">ADET</p>
                    <p class="header text-center">TOPLAM FIYAT</p>
                </div>
                <div id="List">
                    <div class="hidden" id="skeleton">
                        <article class="productBox bg-transparent" id="skeletonBox1">
                            <div class="imageBox h-20">
                                <div class="skeleton w-full h-full"></div>
                            </div>
                            <div class="productDetails">
                                <p class="skeleton w-3/4 h-4"></p>
                                <p class="skeleton w-3/4 h-4"><span class="lg:hidden skeleton"></span></p>
                                <div class="quantityBox"><button class="btn skeleton"></button><input class="skeleton" type="number" min="0" /><button class="btn skeleton"></button></div>
                                <div class="totalDiv">
                                    <div class="spinner hidden"></div>
                                    <p class="total skeleton w-3/4 h-4" id="total24"><span class="lg:hidden"></span><span class="totalValue"></span></p>
                                </div>
                            </div>
                            <button class="btn-close skeleton w-5 h-5"></button>
                        </article>
                        <article class="productBox bg-transparent">
                            <div class="imageBox h-20">
                                <div class="skeleton w-full h-full"></div>
                            </div>
                            <div class="productDetails">
                                <p class="skeleton w-3/4 h-4"></p>
                                <p class="skeleton w-3/4 h-4"><span class="lg:hidden skeleton"></span></p>
                                <div class="quantityBox"><button class="btn skeleton"></button><input class="skeleton" type="number" min="0" /><button class="btn skeleton"></button></div>
                                <div class="totalDiv">
                                    <div class="spinner hidden"></div>
                                    <p class="total skeleton w-3/4 h-4"><span class="lg:hidden"></span><span class="totalValue"></span></p>
                                </div>
                            </div>
                            <button class="btn-close skeleton w-5 h-5"></button>
                        </article>
                        <article class="productBox bg-transparent" id="skeletonBox3">
                            <div class="imageBox h-20">
                                <div class="skeleton w-full h-full"></div>
                            </div>
                            <div class="productDetails">
                                <p class="skeleton w-3/4 h-4"></p>
                                <p class="skeleton w-3/4 h-4"><span class="lg:hidden skeleton"></span></p>
                                <div class="quantityBox"><button class="btn skeleton"></button><input class="skeleton" type="number" min="0" /><button class="btn skeleton"></button></div>
                                <div class="totalDiv">
                                    <div class="spinner hidden"></div>
                                    <p class="total skeleton w-3/4 h-4"><span class="lg:hidden"></span><span class="totalValue"></span></p>
                                </div>
                            </div>
                            <button class="btn-close skeleton w-5 h-5"></button>
                        </article>
                        <article class="productBox bg-transparent" id="skeletonBox34">
                            <div class="imageBox h-20">
                                <div class="skeleton w-full h-full"></div>
                            </div>
                            <div class="productDetails">
                                <p class="skeleton w-3/4 h-4"></p>
                                <p class="skeleton w-3/4 h-4"><span class="lg:hidden skeleton"></span></p>
                                <div class="quantityBox"><button class="btn skeleton"></button><input class="skeleton" type="number" min="0" /><button class="btn skeleton"></button></div>
                                <div class="totalDiv">
                                    <div class="spinner hidden"></div>
                                    <p class="total skeleton w-3/4 h-4"><span class="lg:hidden"></span><span class="totalValue"></span></p>
                                </div>
                            </div>
                            <button class="btn-close skeleton w-5 h-5"></button>
                        </article>
                    </div>
                    <div id="productList" class="productList divide-y divide-gray-200 lg:max-h-[500px] lg:overflow-y-auto mt-4 lg:mt-0"></div>
                </div>
            </section>
            <aside id="summary" class="summary lg:col-span-1 h-fit">
                <h2>Sipariş özeti</h2>
                <div class="summaryBox bg-white mt-3 p-2 divide-y divide-gray-500 gap-2">
                    <div class="subtotal flex justify-between items-center p-4">
                        <p class="text-sm">Ara toplam <span id="item-count">(0 adet)</span></p>
                        <p id="subtotalPrice" class="text-sm">0.00$</p>
                    </div>
                    <div class="shippment flex md:justify-between items-center p-4 gap-1">
                        <p class="text-sm">Kargo</p>
                        <p class="text-sm text-right">Bir sonraki adımda hesaplanacak</p>
                    </div>
                    <div class="total flex justify-between items-center p-4">
                        <p class="text-sm font-bold">Toplam <span class="font-normal">(KDV dahil)</span></p>
                        <p id="totalCart" class="text-sm">0.00$</p>
                    </div>
                    <div class="flex justify-center">
                        <a href="login.html" class="button">Sepeti onayla</a>
                    </div>
                </div>
            </aside>
        </main>
        <script type="module" src="../dist/index.js"></script>
    </body>
</html>
