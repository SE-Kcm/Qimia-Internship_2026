<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cartify Login</title>
        <link rel="stylesheet" href="../dist/output.css" />
    </head>
    <body class="bg-gray-100">
        <header class="h-20 bg-white w-screen">
            <div class="grid grid-cols-3">
                <a class="flex mx-2 items-center" href="index.html">
                    <img class="w-6" src="images/House_Icon.png" />
                    <span class="hidden md:block text-sm font-bold ml-1">Geri</span>
                </a>
                <div class="flex col-span-1 justify-center">
                    <img class="flex w-40 h-20" src="./images/Logo_new.png" />
                </div>
            </div>
        </header>
        <main>
            <section class="container max-w-xl px-4 mx-auto text-left">
                <h1>Oturum Aç</h1>
                <div class="tab flex my-3">
                    <button id="emailTab" class="tablinks active w-1/2 border-b-4 border-b-blue-800">E-Mail</button>
                    <button id="phoneTab" class="tablinks active w-1/2 border-b-4 border-b-gray-400">Telefon Numarası</button>
                </div>
                <div id="E-Mail" class="tabcontent">
                    <form>
                        <label>E-posta</label>
                        <input class="w-full mt-1 mb-3 h-10 text-left p-2" type="email" placeholder="E-posta" />
                        <input class="button w-full bg-blue-70 h-10" type="submit" value="İleri" />
                    </form>
                </div>
                <div id="Phone" class="tabcontent hidden">
                    <form>
                        <div class="flex items-center justify-center gap-1">
                            <div class="w-1/3 flex flex-col">
                                <label>Ülke </label>
                                <select class="w-full h-10 mt-1 mb-3 px-2 border-2 border-gray-300 bg-white" id="country-code" name="countryCode" required>
                                    <option value="+90">🇹🇷 +90 (TR)</option>
                                </select>
                                <!-- <label for="country">Ülke </label>
                                <input id="country" class="w-full mt-1 mb-3 h-10 text-left p-2" type="email" placeholder="Ülke" /> -->
                            </div>
                            <div class="w-2/3">
                                <label for="phoneNumber">Telefon Numarası </label>
                                <input id="phoneNumber" class="w-full mt-1 mb-3 h-10 text-left p-2" type="tel" placeholder="Cep telefonu numarası" />
                            </div>
                        </div>
                        <input class="button w-full bg-blue-70 h-10" type="submit" value="İleri" />
                    </form>
                </div>
                <p class="font-semibold text-base mt-4">Cartify hesabınız yok mu? Hemen oluşturun!</p>
                <a class="flex items-center mt-2" href="signUp.html">Hesap oluştur</a>
            </section>
        </main>

        <script type="module" src="../dist/login.js"></script>
    </body>
</html>
