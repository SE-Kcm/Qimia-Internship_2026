                    <p class="header col-span-2">ÜRÜN</p>
                    <p class="header">BİRİM FİYAT</p>
                    <p class="header">ADET</p>
                    <p class="header">TOPLAM FIYAT</p>
                </div>

                <h1>Sipariş özeti</h1>
                <div class="summaryBox bg-white mt-3 p-2 divide-y divide-gray-500">
                    <div class="subtotal flex justify-between items-center p-4">
                        <p>Ara toplam <span id="item-count">(0 adet)</span></p>
                        <p id="subtotalPrice">0.00$</p>
                    </div>
                    <div class="shippment flex justify-between items-center p-4">
                        <p>Kargo</p>
                        <p>Bir sonraki adımda hesaplanacak</p>
                    </div>
                    <div class="total flex justify-between items-center p-4">
                        <p class="text-lg font-bold">Toplam <span class="text-base font-normal">(KDV dahil)</span></p>
                        <p id="totalCart">0.00$</p>
                    </div>
                    <div class="flex justify-center">
                        <button class="justify-center items-center bg-blue-800 font-bold text-white m-4 h-10 w-full">Sepeti onayla</button>
